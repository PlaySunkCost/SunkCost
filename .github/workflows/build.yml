name: Build

# Builds the HQ prototype for Windows and Linux via the project's own build
# entry points (Assets/_Project/Editor/Prototype/HQPrototypeBuild.cs), which
# stamp the Steam build-identity manifest the same way a developer's manual
# build does. Requires a one-time Unity license secret — see
# docs/WORKFLOW.md#continuous-integration.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch: {}

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UNITY_VERSION: 6000.6.0f1

jobs:
  build:
    name: Build (${{ matrix.targetPlatform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - targetPlatform: StandaloneWindows64
            buildMethod: SunkCost.Editor.Prototype.HQPrototypeBuild.BuildWindowsDevelopment
            buildsDir: Builds/HQPrototype
            artifactName: sunkcost-hq-windows
          - targetPlatform: StandaloneLinux64
            buildMethod: SunkCost.Editor.Prototype.HQPrototypeBuild.BuildLinuxDevelopment
            buildsDir: Builds/HQPrototypeLinux
            artifactName: sunkcost-hq-linux
    steps:
      - name: Checkout (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.targetPlatform }}-

      - name: Build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: ${{ matrix.targetPlatform }}
          buildMethod: ${{ matrix.buildMethod }}
          allowDirtyBuild: false

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifactName }}
          path: ${{ matrix.buildsDir }}
          if-no-files-found: error
          retention-days: 14
